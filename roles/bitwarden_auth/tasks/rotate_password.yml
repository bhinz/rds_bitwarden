---
# Übergabevariable: bitwarden_auth_item_id (die UUID des Eintrags)
# Rückgabevariable: bitwarden_auth_rotated_password

- name: Prüfen, ob eine Item-ID übergeben wurde
  ansible.builtin.assert:
    that: bitwarden_auth_item_id is defined and bitwarden_auth_item_id != ""
    fail_msg: "Bitte gib die UUID des Bitwarden-Eintrags in 'bitwarden_auth_item_id' an."

- name: Interner Status für automatisch erzeugte Session initialisieren
  ansible.builtin.set_fact:
    _bitwarden_auth_local_session_started: false
  changed_when: false
  no_log: true

- name: Session bei Bedarf automatisch erzeugen
  when: bitwarden_auth_session is not defined or bitwarden_auth_session == ""
  block:
    - name: Login und Unlock automatisch durchführen
      ansible.builtin.include_tasks: main.yml

    - name: Merken, dass rotate_password diese Session erzeugt hat
      ansible.builtin.set_fact:
        _bitwarden_auth_local_session_started: true
      changed_when: false
      no_log: true

- name: Neues sicheres Passwort generieren
  # Wir nutzen die Bitwarden-eigene Logik für Konsistenz
  ansible.builtin.command: "bw generate --uppercase --lowercase --number --special --length 24"
  environment:
    BITWARDENCLI_APPDATA_DIR: "{{ bitwarden_auth_appdata_dir | default('/tmp/bw_ansible_' ~ inventory_hostname) }}"
  register: _bitwarden_auth_gen_res
  changed_when: false
  no_log: true

- name: Generiertes Passwort als Fact setzen
  ansible.builtin.set_fact:
    bitwarden_auth_rotated_password: "{{ _bitwarden_auth_gen_res.stdout }}"
  no_log: true

- name: Aktuellen Bitwarden-Eintrag abrufen
  ansible.builtin.command: "bw get item {{ bitwarden_auth_item_id }}"
  environment:
    BW_SESSION: "{{ bitwarden_auth_session }}"
    BITWARDENCLI_APPDATA_DIR: "{{ bitwarden_auth_appdata_dir | default('/tmp/bw_ansible_' ~ inventory_hostname) }}"
  register: _bitwarden_auth_item_get
  changed_when: false
  no_log: true

- name: Bitwarden-Eintrag lokal mit neuem Passwort aktualisieren
  ansible.builtin.set_fact:
    _bitwarden_auth_updated_json: "{{ _bitwarden_auth_item_get.stdout | from_json | combine({'login': {'password': bitwarden_auth_rotated_password}}, recursive=True) }}"
  no_log: true

- name: Aktualisierten Eintrag zurück nach Bitwarden schreiben
  ansible.builtin.shell:
    cmd: "bw encode | bw edit item {{ bitwarden_auth_item_id }}"
    stdin: "{{ _bitwarden_auth_updated_json | to_json }}"
  environment:
    BW_SESSION: "{{ bitwarden_auth_session }}"
    BITWARDENCLI_APPDATA_DIR: "{{ bitwarden_auth_appdata_dir | default('/tmp/bw_ansible_' ~ inventory_hostname) }}"
  changed_when: true
  no_log: true

- name: Info-Log (ohne Passwort)
  ansible.builtin.debug:
    msg: "Das Passwort für Item {{ bitwarden_auth_item_id }} wurde erfolgreich rotiert und im Tresor gespeichert."

- name: Automatisch erzeugte Session wieder beenden
  ansible.builtin.include_tasks: logout.yml
  when:
    - _bitwarden_auth_local_session_started | bool
