---
# Übergabevariable: bw_item_id (die UUID des Eintrags)
# Rückgabevariable: bw_rotated_password

- name: Prüfen, ob eine Item-ID übergeben wurde
  ansible.builtin.assert:
    that: bw_item_id is defined and bw_item_id != ""
    fail_msg: "Bitte gib die UUID des Bitwarden-Eintrags in 'bw_item_id' an."

- name: Neues sicheres Passwort generieren
  # Wir nutzen die Bitwarden-eigene Logik für Konsistenz
  ansible.builtin.command: "bw generate --uppercase --lowercase --number --special --length 24"
  register: _bw_gen_res
  changed_when: false
  no_log: true

- name: Generiertes Passwort als Fact setzen
  ansible.builtin.set_fact:
    bw_rotated_password: "{{ _bw_gen_res.stdout }}"
  no_log: true

- name: Aktuellen Bitwarden-Eintrag abrufen
  ansible.builtin.command: "bw get item {{ bw_item_id }}"
  environment:
    BW_SESSION: "{{ bw_session }}"
  register: _bw_item_get
  changed_when: false
  no_log: true

- name: Bitwarden-Eintrag lokal mit neuem Passwort aktualisieren
  ansible.builtin.set_fact:
    _bw_updated_json: "{{ _bw_item_get.stdout | from_json | combine({'login': {'password': bw_rotated_password}}, recursive=True) }}"
  no_log: true

- name: Aktualisierten Eintrag zurück nach Bitwarden schreiben
  ansible.builtin.shell: "bw encode | bw edit item {{ bw_item_id }}"
  environment:
    BW_SESSION: "{{ bw_session }}"
  stdin: "{{ _bw_updated_json | to_json }}"
  changed_when: true
  no_log: true

- name: Info-Log (ohne Passwort)
  ansible.builtin.debug:
    msg: "Das Passwort für Item {{ bw_item_id }} wurde erfolgreich rotiert und im Tresor gespeichert."