---
# Input variable: bitwarden_auth_item_id (the UUID of the item)
# Return variable: bitwarden_auth_rotated_password

- name: Check whether an item ID was provided
  ansible.builtin.assert:
    that: bitwarden_auth_item_id is defined and bitwarden_auth_item_id != ""
    fail_msg: "Please provide the UUID of the Bitwarden item in 'bitwarden_auth_item_id'."

- name: Initialize internal state for auto-created session
  ansible.builtin.set_fact:
    _bitwarden_auth_local_session_started: false
  changed_when: false
  no_log: true

- name: Automatically create session if needed
  when: bitwarden_auth_session is not defined or bitwarden_auth_session == ""
  block:
    - name: Run login and unlock automatically
      ansible.builtin.include_tasks: main.yml

    - name: Record that rotate_password created this session
      ansible.builtin.set_fact:
        _bitwarden_auth_local_session_started: true
      changed_when: false
      no_log: true

- name: Generate a new secure password
  # Use Bitwarden's native generation logic for consistency.
  ansible.builtin.command: "bw generate --uppercase --lowercase --number --special --length 24"
  environment:
    BITWARDENCLI_APPDATA_DIR: "{{ bitwarden_auth_appdata_dir | default('/tmp/bw_ansible_' ~ inventory_hostname) }}"
  register: _bitwarden_auth_gen_res
  changed_when: false
  no_log: true

- name: Store generated password as a fact
  ansible.builtin.set_fact:
    bitwarden_auth_rotated_password: "{{ _bitwarden_auth_gen_res.stdout }}"
  no_log: true

- name: Fetch current Bitwarden item
  ansible.builtin.command: "bw get item {{ bitwarden_auth_item_id }}"
  environment:
    BW_SESSION: "{{ bitwarden_auth_session }}"
    BITWARDENCLI_APPDATA_DIR: "{{ bitwarden_auth_appdata_dir | default('/tmp/bw_ansible_' ~ inventory_hostname) }}"
  register: _bitwarden_auth_item_get
  changed_when: false
  no_log: true

- name: Update Bitwarden item locally with new password
  ansible.builtin.set_fact:
    _bitwarden_auth_updated_json: "{{ _bitwarden_auth_item_get.stdout | from_json | combine({'login': {'password': bitwarden_auth_rotated_password}}, recursive=True) }}"
  no_log: true

- name: Write updated item back to Bitwarden
  ansible.builtin.shell:
    cmd: "bw encode | bw edit item {{ bitwarden_auth_item_id }}"
    stdin: "{{ _bitwarden_auth_updated_json | to_json }}"
  environment:
    BW_SESSION: "{{ bitwarden_auth_session }}"
    BITWARDENCLI_APPDATA_DIR: "{{ bitwarden_auth_appdata_dir | default('/tmp/bw_ansible_' ~ inventory_hostname) }}"
  changed_when: true
  no_log: true

- name: Info log (without password)
  ansible.builtin.debug:
    msg: "The password for item {{ bitwarden_auth_item_id }} was rotated successfully and stored in the vault."

- name: Terminate auto-created session
  ansible.builtin.include_tasks: logout.yml
  when:
    - _bitwarden_auth_local_session_started | bool
